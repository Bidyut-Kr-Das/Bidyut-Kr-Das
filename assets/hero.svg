<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t">
<title id="t">Bidyut Kr. Das, also known as ShadowFrost. Building scalable backends and AI tools.</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030812"/>
    <stop offset="1" stop-color="#0B1A2F"/>
  </linearGradient>
  <linearGradient id="aurA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
    <stop offset=".35" stop-color="#5EEAD4"/>
    <stop offset=".7" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="aurB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818CF8" stop-opacity="0"/>
    <stop offset=".5" stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <clipPath id="card"><rect width="1000" height="340" rx="16"/></clipPath>
  <clipPath id="type"><rect x="56" y="178" width="900" height="34"><animate attributeName="width" values="0;0;900" keyTimes="0;.15;1" dur="3s" fill="freeze"/></rect></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
.a1{animation:drift 13s ease-in-out infinite alternate;transform-origin:500px 90px}
.a2{animation:drift 17s ease-in-out -7s infinite alternate-reverse;transform-origin:620px 60px}
@keyframes drift{from{transform:translateX(-50px) scaleY(.8)}to{transform:translateX(50px) scaleY(1.2)}}
.tw{animation:tw 2.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.sn{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(-40px,370px)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1000" height="340" fill="url(#sky)"/>

  <g fill="#CFE8FF">
    <circle cx="612" cy="28" r="1.2" class="tw"/>
    <circle cx="702" cy="66" r=".9"/>
    <circle cx="781" cy="22" r="1.4" class="tw" style="animation-delay:-1.2s"/>
    <circle cx="866" cy="54" r="1"/>
    <circle cx="944" cy="30" r="1.2" class="tw" style="animation-delay:-2s"/>
    <circle cx="912" cy="118" r=".8"/>
    <circle cx="828" cy="140" r="1.1" class="tw" style="animation-delay:-.6s"/>
    <circle cx="540" cy="70" r=".8"/>
    <circle cx="470" cy="24" r="1.1" class="tw" style="animation-delay:-1.7s"/>
    <circle cx="388" cy="52" r=".9"/>
    <circle cx="300" cy="18" r="1.2"/>
    <circle cx="214" cy="40" r=".8" class="tw" style="animation-delay:-2.4s"/>
    <circle cx="128" cy="22" r="1"/>
    <circle cx="44" cy="46" r="1.3" class="tw" style="animation-delay:-.9s"/>
    <circle cx="660" cy="120" r=".9"/>
    <circle cx="968" cy="170" r="1" class="tw" style="animation-delay:-1.4s"/>
    <circle cx="740" cy="176" r=".8"/>
  </g>

  <g filter="url(#glow)" opacity=".8">
    <path class="a1" fill="url(#aurA)" d="M-60 120 C 180 30, 380 150, 640 60 S 940 20, 1060 80 L 1060 112 C 900 70, 780 130, 640 104 S 240 100, -60 160 Z"/>
    <path class="a2" fill="url(#aurB)" d="M200 60 C 400 0, 560 90, 760 30 S 980 10, 1080 40 L 1080 64 C 960 40, 860 80, 760 64 S 420 40, 200 92 Z"/>
  </g>

  <text x="56" y="150" font-size="68" font-weight="700" fill="#EAF6FF" letter-spacing="-1">Bidyut Kr. Das</text>
  <g clip-path="url(#type)">
    <text x="56" y="202" font-size="18" fill="#CFE8FF"><tspan fill="#5EEAD4">shadowfrost</tspan><tspan fill="#5B7290">@</tspan><tspan fill="#7DD3FC">dev</tspan><tspan fill="#5B7290">:~$</tspan> building scalable backends &amp; AI tools <tspan class="cur" fill="#7DD3FC">&#9612;</tspan></text>
  </g>

  <polygon fill="#0C1B33" points="0,340 0,282 90,246 160,266 250,214 330,256 420,232 520,270 600,228 700,252 790,206 880,250 1000,226 1000,340"/>
  <polygon fill="#CFE8FF" opacity=".35" points="250,214 232,225 242,224 250,231 258,223 268,225"/>
  <polygon fill="#CFE8FF" opacity=".35" points="790,206 770,218 781,217 790,225 799,216 810,219"/>
  <polygon fill="#071122" points="0,340 0,306 120,286 230,310 360,282 470,306 610,290 740,314 860,292 1000,302 1000,340"/>

  <g fill="#EAF6FF">
    <circle cx="80" cy="0" r="1.6" class="sn" style="animation-duration:9s;animation-delay:-2s" opacity=".7"/>
    <circle cx="170" cy="0" r="1.1" class="sn" style="animation-duration:12s;animation-delay:-8s" opacity=".5"/>
    <circle cx="260" cy="0" r="2" class="sn" style="animation-duration:8s;animation-delay:-5s" opacity=".6"/>
    <circle cx="350" cy="0" r="1.2" class="sn" style="animation-duration:11s;animation-delay:-1s" opacity=".5"/>
    <circle cx="440" cy="0" r="1.6" class="sn" style="animation-duration:10s;animation-delay:-6s" opacity=".7"/>
    <circle cx="530" cy="0" r="1" class="sn" style="animation-duration:13s;animation-delay:-3s" opacity=".4"/>
    <circle cx="620" cy="0" r="1.8" class="sn" style="animation-duration:9s;animation-delay:-7s" opacity=".6"/>
    <circle cx="710" cy="0" r="1.2" class="sn" style="animation-duration:12s;animation-delay:-10s" opacity=".5"/>
    <circle cx="800" cy="0" r="1.5" class="sn" style="animation-duration:10s;animation-delay:-4s" opacity=".7"/>
    <circle cx="890" cy="0" r="1" class="sn" style="animation-duration:14s;animation-delay:-9s" opacity=".4"/>
    <circle cx="980" cy="0" r="1.7" class="sn" style="animation-duration:9s;animation-delay:-1.5s" opacity=".6"/>
    <circle cx="1040" cy="0" r="1.3" class="sn" style="animation-duration:11s;animation-delay:-5.5s" opacity=".5"/>
  </g>
</g>
<rect x=".5" y=".5" width="999" height="339" rx="16" fill="none" stroke="#1C3352"/>
</svg>
